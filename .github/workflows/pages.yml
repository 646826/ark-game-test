name: Deploy playable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Pages deployment started. Commit \`${GITHUB_SHA}\`; run \`${GITHUB_RUN_ID}\`."

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Import verified Starlight Relay release
        id: import
        if: ${{ hashFiles('STARLIGHT_IMPORT_TRIGGER.txt') != '' }}
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c714-820e-b620-1c966373f326/raw?se=2026-08-07T13%3A34%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=81e31c2f-9caf-5389-9259-b407b425aaee&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T10%3A27%3A21Z&ske=2026-08-08T10%3A27%3A21Z&sks=b&skv=2026-02-06&sig=xhSuIDcPBdoC6qYntXofo3uEFm1zvz7wzBzCbOKd3Xw%3D'
          BUNDLE_SHA256: e711ec69cdeef73a240ff4e22c2d136975282ee6c367fe12b7b8e26b4f0096cf
          SOURCE_COMMIT: b1c1b31984b0d3ad2095d12f9ee02e14c2fa7503
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle_zip="$RUNNER_TEMP/starlight-relay-static.zip"
          bundle_dir="$RUNNER_TEMP/starlight-relay-static"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            "$BUNDLE_URL" -o "$bundle_zip"
          echo "$BUNDLE_SHA256  $bundle_zip" | sha256sum -c -
          mkdir -p "$bundle_dir"
          unzip -q "$bundle_zip" -d "$bundle_dir"
          test -f "$bundle_dir/index.html"
          test -f "$bundle_dir/build-info.json"
          test -n "$(find "$bundle_dir/assets" -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -z "$(find "$bundle_dir" -type l -print -quit)"
          test -z "$(find "$bundle_dir" -type f -name '*.map' -print -quit)"
          grep -F '<title>Starlight Relay</title>' "$bundle_dir/index.html"
          grep -F 'data-role="app"' "$bundle_dir/index.html"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/starlight-relay-static/build-info.json','utf8')); if(p.sourceCommit!==process.env.SOURCE_COMMIT) process.exit(1)"

          target='public/starlight-relay'
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$bundle_dir"/. "$target"/
          rm -f .github/workflows/import-starlight-relay-static.yml STARLIGHT_IMPORT_TRIGGER.txt

          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8').rstrip()
          marker = '## Hosted games'
          section = '''## Hosted games

- **Clockwork Conservatory:** https://646826.github.io/ark-game-test/
- **Starlight Relay:** https://646826.github.io/ark-game-test/starlight-relay/

The Starlight Relay directory contains generated static release files built from private source commit `b1c1b31984b0d3ad2095d12f9ee02e14c2fa7503`. Its `build-info.json` preserves that source binding; no private repository credentials or source maps are published.
'''
          if marker in text:
              prefix = text.split(marker, 1)[0].rstrip()
              path.write_text(prefix + '\n\n' + section, encoding='utf-8')
          else:
              path.write_text(text + '\n\n' + section, encoding='utf-8')
          PY

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          {
            echo .github/workflows/import-starlight-relay-static.yml
            echo README.md
            echo STARLIGHT_IMPORT_TRIGGER.txt
            find public/starlight-relay -type f -printf '%p\n'
          } | sort -u > "$expected"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$actual"
          diff -u "$expected" "$actual"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pages): publish verified Starlight Relay subpath' \
            -m "Source: 646826/arkadium-game-factory@$SOURCE_COMMIT" \
            -m "Bundle SHA-256: $BUNDLE_SHA256" \
            -m 'Removes one-shot importer files from the final tree.' \
            -m 'Refs #1'
          release_sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Verified Starlight Relay static files committed to public \`main\` as \`${release_sha}\` from source \`${SOURCE_COMMIT}\`. Continuing with Pages deployment in run \`${GITHUB_RUN_ID}\`."
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c714-820e-b620-1c966373f326/raw?se=2026-08-07T13%3A34%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=81e31c2f-9caf-5389-9259-b407b425aaee&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T10%3A27%3A21Z&ske=2026-08-08T10%3A27%3A21Z&sks=b&skv=2026-02-06&sig=xhSuIDcPBdoC6qYntXofo3uEFm1zvz7wzBzCbOKd3Xw%3D'
          BUNDLE_SHA256: e711ec69cdeef73a240ff4e22c2d136975282ee6c367fe12b7b8e26b4f0096cf
          SOURCE_COMMIT: b1c1b31984b0d3ad2095d12f9ee02e14c2fa7503

      - name: Install dependencies
        run: npm install

      - name: Run repository CI
        run: npm run ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify Clockwork Conservatory root
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$PAGE_URL" -o "$RUNNER_TEMP/root.html"; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then exit 1; fi
            sleep 5
          done
          grep -F '<title>Clockwork Conservatory · Bloom Circuit</title>' "$RUNNER_TEMP/root.html"

      - name: Verify Starlight Relay subpath and assets
        if: ${{ hashFiles('public/starlight-relay/index.html') != '' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          starlight_url="${PAGE_URL%/}/starlight-relay/"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$starlight_url" -o "$RUNNER_TEMP/starlight.html"; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then exit 1; fi
            sleep 5
          done
          grep -F '<title>Starlight Relay</title>' "$RUNNER_TEMP/starlight.html"
          grep -F 'data-role="app"' "$RUNNER_TEMP/starlight.html"
          grep -oE '(src|href)="\./[^"]+"' "$RUNNER_TEMP/starlight.html" \
            | sed -E 's/^[^=]+="\.\///; s/"$//' \
            | sort -u \
            | while IFS= read -r asset; do
                curl --fail --silent --show-error --location \
                  --connect-timeout 10 --max-time 30 \
                  "${starlight_url}${asset}" -o /dev/null
              done
          curl --fail --silent --show-error --location \
            "${starlight_url}build-info.json" -o "$RUNNER_TEMP/build-info.json"
          grep -F '"sourceCommit"' "$RUNNER_TEMP/build-info.json"
          printf 'starlight_url=%s\n' "$starlight_url"

      - name: Publish verified Starlight URL
        if: ${{ success() && hashFiles('public/starlight-relay/index.html') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.import.outputs.release_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          starlight_url="${PAGE_URL%/}/starlight-relay/"
          source_commit="$(node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('public/starlight-relay/build-info.json','utf8')); process.stdout.write(p.sourceCommit)")"
          host_commit="${RELEASE_SHA:-$GITHUB_SHA}"
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Starlight Relay deployment verified. Source commit \`${source_commit}\`; host commit \`${host_commit}\`; run \`${GITHUB_RUN_ID}\`; URL: ${starlight_url}"

      - name: Publish deployment failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Pages deployment failed. Commit \`${GITHUB_SHA}\`; run \`${GITHUB_RUN_ID}\`. No playable Starlight URL was claimed."
