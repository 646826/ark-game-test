name: Import verified Starlight Relay static bundle

on:
  push:
    branches: [deploy/import-starlight-relay-static]

permissions:
  contents: write
  issues: write

concurrency:
  group: import-starlight-relay-static
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-065c-820e-a9e4-d10c0df3eb87/raw?se=2026-08-07T13%3A22%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=d4b2b166-d34c-5301-86fb-d9ec702a8178&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T09%3A40%3A21Z&ske=2026-08-08T09%3A40%3A21Z&sks=b&skv=2026-02-06&sig=QBWnSi/ahKI33RPx3gjzQ1rDD39zdu8/WYKRoEnMcRc%3D'
      BUNDLE_SHA256: e711ec69cdeef73a240ff4e22c2d136975282ee6c367fe12b7b8e26b4f0096cf
      SOURCE_COMMIT: b1c1b31984b0d3ad2095d12f9ee02e14c2fa7503
      EXPECTED_MAIN: f2e5d8d4e7ed71b396b481105717fcc2160d3518
    steps:
      - name: Check out helper branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download and validate exact static bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle_zip="$RUNNER_TEMP/starlight-relay-static.zip"
          bundle_dir="$RUNNER_TEMP/starlight-relay-static"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            "$BUNDLE_URL" -o "$bundle_zip"
          echo "$BUNDLE_SHA256  $bundle_zip" | sha256sum -c -
          mkdir -p "$bundle_dir"
          unzip -q "$bundle_zip" -d "$bundle_dir"
          test -f "$bundle_dir/index.html"
          test -f "$bundle_dir/build-info.json"
          test -n "$(find "$bundle_dir/assets" -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -z "$(find "$bundle_dir" -type l -print -quit)"
          test -z "$(find "$bundle_dir" -type f -name '*.map' -print -quit)"
          grep -F '<title>Starlight Relay</title>' "$bundle_dir/index.html"
          grep -F 'data-role="app"' "$bundle_dir/index.html"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/starlight-relay-static/build-info.json','utf8')); if(p.sourceCommit!==process.env.SOURCE_COMMIT) process.exit(1)"

      - name: Switch to exact public main and install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git switch --detach origin/main
          npm install

      - name: Materialize Starlight under public subpath
        shell: bash
        run: |
          set -Eeuo pipefail
          target='public/starlight-relay'
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/starlight-relay-static"/. "$target"/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8').rstrip()
          marker = '## Hosted games'
          section = '''## Hosted games

- **Clockwork Conservatory:** https://646826.github.io/ark-game-test/
- **Starlight Relay:** https://646826.github.io/ark-game-test/starlight-relay/

The Starlight Relay directory contains generated static release files built from private source commit `b1c1b31984b0d3ad2095d12f9ee02e14c2fa7503`. Its `build-info.json` preserves that source binding; no private repository credentials or source maps are published.
'''
          if marker in text:
              prefix = text.split(marker, 1)[0].rstrip()
              path.write_text(prefix + '\n\n' + section, encoding='utf-8')
          else:
              path.write_text(text + '\n\n' + section, encoding='utf-8')
          PY

      - name: Verify existing game and Starlight release together
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run ci
          test -f dist/index.html
          test -f dist/starlight-relay/index.html
          test -f dist/starlight-relay/build-info.json
          grep -F '<title>Clockwork Conservatory · Bloom Circuit</title>' dist/index.html
          grep -F '<title>Starlight Relay</title>' dist/starlight-relay/index.html
          grep -F 'data-role="app"' dist/starlight-relay/index.html
          test -n "$(find dist/starlight-relay/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -z "$(find dist/starlight-relay -type l -print -quit)"
          test -z "$(find dist/starlight-relay -type f -name '*.map' -print -quit)"

      - name: Commit exact public release scope
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          {
            echo README.md
            find public/starlight-relay -type f -printf '%p\n'
          } | sort -u > "$expected"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$actual"
          diff -u "$expected" "$actual"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md public/starlight-relay
          git commit -m 'feat(pages): publish verified Starlight Relay subpath' \
            -m "Source: 646826/arkadium-game-factory@$SOURCE_COMMIT" \
            -m "Bundle SHA-256: $BUNDLE_SHA256" \
            -m 'Refs #1'
          release_sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:main
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Record static release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Verified Starlight Relay static files committed to public \`main\` as \`${{ steps.commit.outputs.sha }}\` from source \`${SOURCE_COMMIT}\`. Pages deployment verification is now running."

      - name: Publish bounded failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body "Starlight static import failed in run \`${GITHUB_RUN_ID}\`. No unverified public release was claimed."
